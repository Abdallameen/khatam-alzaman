<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خاتم الزمن — الفصل الأول</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;color:#fff;user-select:none}
  #c{position:fixed;inset:0;display:block;transition:filter .6s}
  #c.frozen{filter:grayscale(.85) contrast(1.15) hue-rotate(180deg) brightness(.95)}
  .layer{position:fixed;inset:0;pointer-events:none}
  #fade{background:#000;opacity:1;transition:opacity 1.2s}
  #redflash{background:radial-gradient(transparent 40%,rgba(200,0,0,.65));opacity:0;transition:opacity .25s}
  #vignette{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
  #frozenfx{background:radial-gradient(ellipse at center,transparent 35%,rgba(60,170,255,.35));opacity:0;transition:opacity .4s}
  .bar{position:fixed;left:0;right:0;height:0;background:#000;transition:height .8s;z-index:5}
  #barT{top:0}#barB{bottom:0}
  body.cine #barT,body.cine #barB{height:11vh}
  #hud{position:fixed;top:18px;right:22px;width:280px;z-index:6;opacity:0;transition:opacity .6s}
  #hud.on{opacity:1}
  .meter{height:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.35);border-radius:7px;overflow:hidden;margin-bottom:8px}
  .meter>div{height:100%;width:100%;transition:width .15s}
  #hp>div{background:linear-gradient(90deg,#8b0000,#e53935)}
  #en>div{background:linear-gradient(90deg,#0d47a1,#4fc3f7)}
  .lbl{font-size:12px;opacity:.8;margin-bottom:3px}
  #objective{position:fixed;top:18px;left:22px;max-width:40vw;z-index:6;background:rgba(0,0,0,.45);padding:10px 16px;border-right:3px solid #ffca28;border-radius:6px;font-size:16px;opacity:0;transition:opacity .5s}
  #objective.on{opacity:1}
  #prompt{position:fixed;bottom:22vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 18px;border-radius:20px;font-size:17px;display:none;z-index:6}
  #dialog{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);width:min(900px,92vw);background:linear-gradient(180deg,rgba(10,12,20,.88),rgba(5,6,10,.95));border:1px solid rgba(255,215,120,.45);border-radius:10px;padding:18px 26px 26px;z-index:9;display:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #dname{color:#ffca28;font-weight:bold;font-size:19px;margin-bottom:8px}
  #dtext{font-size:22px;line-height:1.7;min-height:2.2em}
  #dnext{position:absolute;left:18px;bottom:8px;font-size:13px;opacity:.6;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.15}}
  #cards{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:16;background:#000;padding:8vw}
  #ctext{font-size:clamp(20px,2.6vw,34px);line-height:1.9;text-align:center;max-width:1000px;opacity:0;transition:opacity .9s;white-space:pre-line}
  #cnext{position:fixed;bottom:5vh;left:50%;transform:translateX(-50%);opacity:.5;font-size:14px}
  #title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#14203a 0%,#000 75%)}
  #title h1{font-size:clamp(48px,9vw,120px);letter-spacing:4px;background:linear-gradient(180deg,#fff6d5,#d4a236 60%,#7a5410);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 50px rgba(255,200,80,.25)}
  #title h2{font-weight:normal;opacity:.75;margin:10px 0 50px;font-size:clamp(16px,2vw,24px)}
  #title .start{font-size:22px;animation:blink 1.6s infinite}
  #title .ctrl{position:absolute;bottom:4vh;font-size:14px;opacity:.6;text-align:center;line-height:1.9}
  .ring{width:110px;height:110px;border-radius:50%;border:6px solid #d4a236;box-shadow:0 0 30px #ffcc55,inset 0 0 25px #ffcc55;margin-bottom:30px;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotateY(360deg)}}
  #big{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.9);font-size:clamp(28px,5vw,64px);font-weight:bold;color:#bfe9ff;text-shadow:0 0 30px #29b6f6,0 0 60px #0277bd;opacity:0;transition:all .8s;z-index:8;text-align:center}
  #big.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #help{position:fixed;bottom:16px;right:22px;font-size:13px;opacity:.75;z-index:6;background:rgba(0,0,0,.4);padding:8px 12px;border-radius:6px;line-height:1.7;display:none}
  .ehp{position:fixed;width:70px;height:7px;background:rgba(0,0,0,.6);border:1px solid #000;transform:translate(-50%,-50%);z-index:4}
  .ehp>div{height:100%;background:#e53935}
  /* تحكم اللمس */
  #touch{position:fixed;inset:0;z-index:7;display:none;touch-action:none}
  body.touch #touch{display:block}
  #joy{position:fixed;left:6vw;bottom:8vh;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35)}
  #knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55)}
  .tb{position:fixed;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
  .tb.down{background:rgba(255,202,40,.55)}
  #bAtk{right:6vw;bottom:10vh;width:84px;height:84px;font-size:18px}
  #bDodge{right:calc(6vw + 96px);bottom:7vh}
  #bTime{right:calc(6vw + 10px);bottom:calc(10vh + 96px);border-color:#4fc3f7}
  #bAct{right:calc(6vw + 96px);bottom:calc(7vh + 82px)}
  body.touch #help{display:none!important}
  body.touch #hud{width:180px;top:10px;right:12px}
  body.touch #objective{top:10px;left:12px;font-size:13px;max-width:55vw}
  body.touch #dtext{font-size:17px}
  body.touch #dialog{bottom:2vh;z-index:9}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div class="layer" id="vignette"></div>
<div class="layer" id="frozenfx"></div>
<div class="layer" id="redflash"></div>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="hud">
  <div class="lbl">الحياة</div><div class="meter" id="hp"><div></div></div>
  <div class="lbl">طاقة الزمن ⏳</div><div class="meter" id="en"><div></div></div>
</div>
<div id="objective"></div>
<div id="prompt"></div>
<div id="big"></div>
<div id="help"></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <div class="tb" id="bAtk" data-a="attack">⚔️<br>هجوم</div>
  <div class="tb" id="bDodge" data-a="dodge">💨<br>تفادي</div>
  <div class="tb" id="bTime" data-a="time">⏳<br>زمن</div>
  <div class="tb" id="bAct" data-a="interact">✋<br>تفاعل</div>
</div>
<div id="dialog"><div id="dname"></div><div id="dtext"></div><div id="dnext">▼ متابعة</div></div>
<div id="cards"><div id="ctext"></div><div id="cnext">اضغط للمتابعة</div></div>
<div class="layer" id="fade" style="z-index:15"></div>
<div id="title">
  <div class="ring"></div>
  <h1>خاتم الزمن</h1>
  <h2>الفصل الأول: الساعة بسنة</h2>
  <div class="start">اضغط أي زر للبدء</div>
  <div class="ctrl">🎮 يد تحكم مدعومة — أو لوحة المفاتيح والفأرة<br>يُفضّل اللعب بملء الشاشة (F11)</div>
</div>

<script type="module">
import * as THREE from 'three';

/* ================= أدوات عامة ================= */
const $ = id => document.getElementById(id);
const wait = s => new Promise(r => setTimeout(r, s * 1000));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 && matchMedia('(pointer:coarse)').matches;
if (isTouch) document.body.classList.add('touch');

/* ================= الصوت ================= */
let ac = null;
function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function tone(f, d, type = 'sine', v = .12, slide = 0) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f * slide), a.currentTime + d);
  g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.0008, a.currentTime + d);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + d);
}
function noise(d = .15, v = .2, hp = 1500) {
  const a = audio(), b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'highpass'; f.frequency.value = hp; g.gain.value = v;
  s.buffer = b; s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  clash() { noise(.25, .3, 2500); tone(1800, .3, 'square', .04, .5); },
  hit() { noise(.12, .3, 400); tone(160, .15, 'sawtooth', .1, .4); },
  swing() { noise(.12, .12, 3000); },
  hurt() { tone(220, .25, 'sawtooth', .12, .5); },
  time() { tone(900, 1.4, 'sine', .15, .08); tone(450, 1.6, 'triangle', .1, .1); },
  unfreeze() { tone(80, .7, 'sine', .15, 8); },
  blip() { tone(700, .04, 'square', .02); },
  dash() { noise(.18, .1, 800); },
  arrow() { tone(1200, .2, 'triangle', .05, .3); },
  magic() { tone(500, .9, 'sine', .1, 3); tone(750, .9, 'sine', .07, 2); },
};

/* ================= المشهد ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.25 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.domElement.id = 'c';
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0xa9cfe8);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY.clone(), 35, 190);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .1, 600);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight(0xe3f1ff, 0x48602c, 1.0));
const sun = new THREE.DirectionalLight(0xfff0cc, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, far: 200 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .85, ...o });

// الأرض
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), M(0x5f8f3c));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// طريق ترابي نحو الغابة
const path = new THREE.Mesh(new THREE.PlaneGeometry(4, 60), M(0x8a7652));
path.rotation.x = -Math.PI / 2; path.position.set(0, .02, -30); path.receiveShadow = true; scene.add(path);

// عشب
{
  const geo = new THREE.ConeGeometry(.08, .5, 3); geo.translate(0, .25, 0);
  const n = isTouch ? 2500 : 6000, inst = new THREE.InstancedMesh(geo, M(0x6fa544), n), d = new THREE.Object3D();
  for (let i = 0; i < n; i++) {
    d.position.set(rand(-120, 120), 0, rand(-130, 60)); d.rotation.set(rand(-.3, .3), rand(0, 6), rand(-.3, .3));
    d.scale.setScalar(rand(.6, 1.6)); d.updateMatrix(); inst.setMatrixAt(i, d.matrix);
  }
  scene.add(inst);
}

// الأشجار (Instanced) + تصادم
const colliders = []; // {x,z,r}
const CLEAR = new THREE.Vector3(0, 0, -72); // مركز فسحة الغابة
{
  const pts = [];
  for (let i = 0; i < 320; i++) { const a = rand(0, Math.PI * 2), r = rand(14, 55); const x = CLEAR.x + Math.cos(a) * r, z = CLEAR.z + Math.sin(a) * r; if (z > -46 && Math.abs(x) < 4) continue; pts.push([x, z, rand(.8, 1.5)]); }
  for (let i = 0; i < 110; i++) { const x = rand(-110, 110), z = rand(-40, 55); if (Math.hypot(x, z) < 18 || Math.abs(x) < 5 || Math.hypot(x - 9, z + 6) < 9) continue; pts.push([x, z, rand(.8, 1.4)]); }
  const tg = new THREE.CylinderGeometry(.25, .4, 3, 7); tg.translate(0, 1.5, 0);
  const l1 = new THREE.ConeGeometry(2, 4, 8); l1.translate(0, 4.5, 0);
  const l2 = new THREE.ConeGeometry(1.5, 3, 8); l2.translate(0, 6.3, 0);
  const trunks = new THREE.InstancedMesh(tg, M(0x5b3d24), pts.length);
  const leaf1 = new THREE.InstancedMesh(l1, M(0x2f6b2a), pts.length);
  const leaf2 = new THREE.InstancedMesh(l2, M(0x3c7f33), pts.length);
  [trunks, leaf1, leaf2].forEach(m => { m.castShadow = true; m.receiveShadow = true; scene.add(m); });
  const d = new THREE.Object3D();
  pts.forEach(([x, z, s], i) => {
    d.position.set(x, 0, z); d.rotation.y = rand(0, 6); d.scale.set(s, s * rand(.9, 1.3), s); d.updateMatrix();
    trunks.setMatrixAt(i, d.matrix); leaf1.setMatrixAt(i, d.matrix); leaf2.setMatrixAt(i, d.matrix);
    colliders.push({ x, z, r: .55 * s + .4 });
  });
}
// الجبال
for (let i = 0; i < 26; i++) {
  const a = i / 26 * Math.PI * 2 + rand(-.1, .1), r = rand(170, 220), h = rand(45, 95);
  const m = new THREE.Mesh(new THREE.ConeGeometry(rand(30, 50), h, 7), M(0x6c7a6a, { flatShading: true }));
  m.position.set(Math.cos(a) * r, h / 2 - 2, Math.sin(a) * r); scene.add(m);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(m.geometry.parameters.radius * .3, h * .3, 7), M(0xf2f6f8, { flatShading: true }));
  cap.position.copy(m.position); cap.position.y = h - 2 - h * .15; scene.add(cap);
}
// صخور
for (let i = 0; i < 40; i++) {
  const r = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.4, 1.3)), M(0x8b8f93, { flatShading: true }));
  const a = rand(0, 6.28), d = rand(6, 40); r.position.set(CLEAR.x + Math.cos(a) * d, .2, CLEAR.z + Math.sin(a) * d);
  if (Math.abs(r.position.x) < 3 && r.position.z > CLEAR.z) continue;
  r.castShadow = r.receiveShadow = true; scene.add(r);
}
// البيت القديم
{
  const h = new THREE.Group(); h.position.set(10, 0, -7); h.rotation.y = -.4;
  const walls = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 6), M(0x9b7a55)); walls.position.y = 2;
  const base = new THREE.Mesh(new THREE.BoxGeometry(7.4, 1, 6.4), M(0x7d7d7d, { flatShading: true })); base.position.y = .5;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.8, 3, 4), M(0x6b2f22)); roof.position.y = 5.5; roof.rotation.y = Math.PI / 4; roof.scale.z = .85;
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, .1), M(0x3e2716)); door.position.set(0, 1.1, 3.02);
  const winM = M(0xffe7a0, { emissive: 0xffc04d, emissiveIntensity: .6 });
  const w1 = new THREE.Mesh(new THREE.BoxGeometry(1, .8, .1), winM); w1.position.set(-2.2, 2.4, 3.02);
  const w2 = w1.clone(); w2.position.x = 2.2;
  [walls, base, roof].forEach(m => { m.castShadow = m.receiveShadow = true; });
  h.add(walls, base, roof, door, w1, w2); scene.add(h);
  colliders.push({ x: 10, z: -7, r: 4.8 });
}
// الحفرة
const PIT = new THREE.Vector3(5, 0, -75);
{
  const p = new THREE.Mesh(new THREE.CircleGeometry(1.6, 24), new THREE.MeshBasicMaterial({ color: 0x0b0805 }));
  p.rotation.x = -Math.PI / 2; p.position.copy(PIT); p.position.y = .03; scene.add(p);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.7, .25, 6, 24), M(0x5a4630)); rim.rotation.x = -Math.PI / 2; rim.position.copy(PIT); rim.position.y = .05; scene.add(rim);
}
// علامة الهدف
const marker = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, 40, 16, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xffd54f, transparent: true, opacity: .25, depthWrite: false, side: THREE.DoubleSide }));
marker.visible = false; scene.add(marker);

/* ================= الشخصيات ================= */
function makeHuman({ skin = 0xe0b18a, shirt = 0x445566, pants = 0x2f2f35, hair = 0x2b1d14, scale = 1 } = {}) {
  const g = new THREE.Group();
  const mats = { skin: M(skin), shirt: M(shirt), pants: M(pants), hair: M(hair) };
  const mesh = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; return m; };
  const torso = mesh(new THREE.BoxGeometry(.7, .85, .4), mats.shirt, 1.27);
  const head = mesh(new THREE.SphereGeometry(.26, 16, 12), mats.skin, 1.94);
  const hairM = mesh(new THREE.SphereGeometry(.28, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mats.hair, 1.97);
  const limb = (w, h, mat) => { const p = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), mat); m.position.y = -h / 2; m.castShadow = true; p.add(m); return p; };
  const armL = limb(.2, .8, mats.shirt), armR = limb(.2, .8, mats.shirt);
  armL.position.set(.47, 1.66, 0); armR.position.set(-.47, 1.66, 0);
  const legL = limb(.26, .85, mats.pants), legR = limb(.26, .85, mats.pants);
  legL.position.set(.18, .86, 0); legR.position.set(-.18, .86, 0);
  g.add(torso, head, hairM, armL, armR, legL, legR);
  g.scale.setScalar(scale);
  g.userData = { armL, armR, legL, legR, head, torso, phase: rand(0, 6), mats, target: null, speed: 3.5, busy: 0, onArrive: null };
  return g;
}
function animHuman(h, speed, dt) {
  const u = h.userData; u.phase += dt * (2 + speed * 2.4);
  const amp = Math.min(speed / 4, 1) * .8, s = Math.sin(u.phase) * amp;
  u.legL.rotation.x = s; u.legR.rotation.x = -s;
  if (u.busy <= 0) { u.armL.rotation.x = -s * .8; u.armR.rotation.x = s * .8; }
  u.torso.position.y = 1.27 + Math.abs(Math.cos(u.phase)) * amp * .05;
}
const addTo = (parent, geo, mat, pos, rot) => { const m = new THREE.Mesh(geo, mat); m.position.set(...pos); if (rot) m.rotation.set(...rot); m.castShadow = true; parent.add(m); return m; };

// راضي (اللاعب)
const player = makeHuman({ shirt: 0x2c3e50, pants: 0x1f2a36, hair: 0x1a120c });
scene.add(player);
const ringMat = new THREE.MeshStandardMaterial({ color: 0xd4a236, emissive: 0xffb300, emissiveIntensity: .6, metalness: .9, roughness: .2 });
const ring = addTo(player.userData.armL, new THREE.TorusGeometry(.09, .03, 8, 16), ringMat, [0, -.82, 0], [Math.PI / 2, 0, 0]);
const ringLight = new THREE.PointLight(0xffb300, 0, 4); ring.add(ringLight);
// سيف الزمن (يظهر بعد الاستيقاظ)
const bladeMat = new THREE.MeshStandardMaterial({ color: 0xbfe9ff, emissive: 0x29b6f6, emissiveIntensity: 1.6, transparent: true, opacity: .9 });
const blade = new THREE.Group();
addTo(blade, new THREE.BoxGeometry(.08, .08, 1.3), bladeMat, [0, 0, .75]);
addTo(blade, new THREE.BoxGeometry(.4, .06, .06), M(0x37474f, { metalness: .8 }), [0, 0, .08]);
blade.position.set(0, -.8, 0); blade.visible = false; player.userData.armR.add(blade);

// خالد
const khaled = makeHuman({ shirt: 0x7b1f1f, pants: 0x2a2320, hair: 0x3a2a1a, skin: 0xd9a77e });
addTo(khaled, new THREE.BoxGeometry(.8, 1.3, .08), M(0x3b1414), [0, 1.05, -.25]); // عباءة
khaled.visible = false; scene.add(khaled);
const khaledShield = addTo(khaled.userData.armL, new THREE.CylinderGeometry(.55, .55, .08, 6), new THREE.MeshStandardMaterial({ color: 0x80deea, emissive: 0x00bcd4, emissiveIntensity: 1.5, transparent: true, opacity: .7 }), [.15, -.7, .2], [0, 0, Math.PI / 2]);

    if (dodgeT > 0) { dodgeT -= dt; player.position.addScaledVector(dodgeDir, 17 * dt); speed = 8; player.rotation.y = Math.atan2(dodgeDir.x, dodgeDir.z); }
    else if (mv.lengthSq() > .001) {
      const s = (combat ? 6.2 : 5.5) * Math.min(1, mv.length());
      player.position.addScaledVector(mv.normalize(), s * dt); speed = s;
      if (atkT <= 0) { const ty = Math.atan2(mv.x, mv.z); let df = ty - player.rotation.y; df = Math.atan2(Math.sin(df), Math.cos(df)); player.rotation.y += df * Math.min(1, dt * 14); }
    }
    collide(player.position);
  }
  if (atkT > 0) { atkT -= dt; u.busy = 1; const p = 1 - atkT / .3; u.armR.rotation.x = -2.6 + p * 3.1; u.armR.rotation.z = -.4 + p * .8; }
  else if (u.busy > 0 && atkT <= 0) { u.busy = 0; u.armR.rotation.z = 0; }
  animHuman(player, speed, dt);
  player.visible = !(invuln > 0 && dodgeT <= 0 && combat && Math.floor(performance.now() / 60) % 2 === 0);
  if (combat) { energy = Math.min(100, energy + dt * (timeStop > 0 ? 0 : 9)); }
  $('hp').firstChild.style.width = hp + '%'; $('en').firstChild.style.width = energy + '%';
}

/* ================= الكاميرا ================= */
function updateCamera(dt, inp) {
  if (mode === 'play') {
    camYaw -= mouseDX * .0028 + inp.cx * 2.6 * dt;
    camPitch = clamp(camPitch + mouseDY * .002 + inp.cy * 1.8 * dt, .05, 1.1);
  }
  mouseDX = mouseDY = 0;
  camTarget.lerp(player.position.clone().setY(1.6), Math.min(1, dt * 8));
  const off = new THREE.Vector3(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch)).multiplyScalar(camDist);
  camera.position.copy(camTarget).add(off);
  if (shake > 0) { shake -= dt; camera.position.add(new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * .5)); }
  camera.lookAt(camTarget);
  sun.position.copy(player.position).add(new THREE.Vector3(30, 50, 20)); sun.target.position.copy(player.position);
}

/* ================= الحلقة الرئيسية ================= */
const clock = new THREE.Clock();
let started = false;
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05);
  const inp = pollInput();
  if (mode === 'title' && inp.any && !started) { started = true; audio(); startGame(); }
  const adv = pressed.interact || pressed.attack;
  if (cardState && adv) advanceCard();
  if (dlg) updateDialog(dt, adv);

  // الإيقاف الزمني
  if (timeStop > 0) { timeStop -= dt; if (timeStop <= 0) { setFrozen(false); sfx.unfreeze(); } }
  const frozen = timeStop > 0 || worldFrozen;

  updatePlayer(dt, inp);
  for (const h of [khaled, ...villagers, ...enemies.filter(e => e.alive && !combat).map(e => e.h)]) { if (!h.visible) continue; const s = moveNPC(h, dt); if (!(h === khaled && khaled.userData.busy)) animHuman(h, s, dt); }
  updateEnemies(dt);
  if (!frozen) updateLeaves(dt);
  for (let i = fx.length - 1; i >= 0; i--) if (!fx[i].update(dt)) fx.splice(i, 1);

  // التفاعل
  if (interactable && mode === 'play' && interactable.obj.visible && interactable.obj.position.distanceTo(player.position) < 3.2) {
    $('prompt').style.display = 'block'; $('prompt').textContent = (gpConnected ? 'Ⓐ ' : '[E] ') + interactable.label;
    if (pressed.interact) { const r = interactable.res; interactable = null; $('prompt').style.display = 'none'; r(); }
  } else $('prompt').style.display = 'none';
  for (let i = waiters.length - 1; i >= 0; i--) if (waiters[i].check()) { waiters[i].res(); waiters.splice(i, 1); }

  marker.material.opacity = .18 + Math.sin(performance.now() / 300) * .08;
  ringLight.intensity = THREE.MathUtils.lerp(ringLight.intensity, ringGlow, dt * 4);
  ringMat.emissiveIntensity = .6 + ringLight.intensity;
  updateCamera(dt, inp);
  renderer.render(scene, camera);
}
let ringGlow = 0, worldFrozen = false;
